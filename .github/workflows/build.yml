name: Build

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      # Tests that need the game client are skipped here.
      - name: Test
        run: dotnet test -c Release
      - name: Publish
        run: dotnet publish src/Chaos.Launcher -c Release -o publish
      - uses: actions/upload-artifact@v7
        with:
          name: ChaosLauncher
          path: publish/ChaosLauncher.exe
          if-no-files-found: error
