name: Release

# A v* tag builds the launcher and publishes it as a GitHub release.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: Test
        run: dotnet test -c Release
      - name: Publish
        shell: pwsh
        run: |
          dotnet publish src/Chaos.Launcher -c Release -o publish -p:Version=$($env:TAG.TrimStart('v'))
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $hash = (Get-FileHash publish/ChaosLauncher.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  ChaosLauncher.exe" | Out-File -Encoding ascii publish/ChaosLauncher.exe.sha256
      - name: Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create $env:TAG publish/ChaosLauncher.exe publish/ChaosLauncher.exe.sha256 `
            THIRD-PARTY-NOTICES.md --title "Chaos Launcher $env:TAG" --generate-notes
